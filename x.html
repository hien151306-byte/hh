<!DOCTYPE html><html lang="vi"><head>    <meta charset="utf-8">    <title>Form Đăng Ký Người Dùng</title>    <style>        body {            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;            background-color: #f4f6f9;            margin: 0;            padding: 40px 20px;            color: #333;        }        .container {            max-width: 500px;            margin: 0 auto;            background: #ffffff;            padding: 40px;            border-radius: 10px;            box-shadow: 0 4px 20px rgba(0,0,0,0.08);        }        h2 {            color: #1a73e8;            margin-top: 0;            text-align: center;            margin-bottom: 25px;            font-size: 24px;        }        .form-group {            margin-bottom: 20px;        }        label {            display: block;            font-weight: 600;            margin-bottom: 8px;            color: #444;            font-size: 14px;        }        input[type="text"],        input[type="email"],        input[type="tel"] {            width: 100%;            padding: 12px 14px;            font-size: 14px;            border: 1px solid #ccd0d5;            border-radius: 6px;            box-sizing: border-box;            transition: border-color 0.2s, box-shadow 0.2s;        }        input[type="text"]:focus,        input[type="email"]:focus,        input[type="tel"]:focus {            border-color: #1a73e8;            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);            outline: none;        }        .radio-group {            display: flex;            gap: 25px;            margin-top: 8px;        }        .radio-group label {            font-weight: normal;            display: inline-flex;            align-items: center;            gap: 6px;            cursor: pointer;        }        .btn-container {            margin-top: 30px;            display: flex;            gap: 12px;        }        input[type="submit"], input[type="reset"] {            flex: 1;            padding: 12px;            font-size: 15px;            font-weight: bold;            border: none;            border-radius: 6px;            cursor: pointer;            transition: background-color 0.2s;        }        input[type="submit"] {            background-color: #1a73e8;            color: white;        }        input[type="submit"]:hover {            background-color: #1557b0;        }        input[type="reset"] {            background-color: #e4e6eb;            color: #4b4f56;        }        input[type="reset"]:hover {            background-color: #d8dadf;        }    </style></head><body><div class="container">    <h2>Form Đăng Ký Người Dùng</h2>        <!-- Form gửi dữ liệu lên server theo yêu cầu -->    <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">                <div class="form-group">            <label for="name">Họ và tên</label>            <input type="text" id="name" name="name" placeholder="Nhập họ và tên..." required>        </div>        <div class="form-group">            <label for="email">Email</label>            <input type="email" id="email" name="email" placeholder="example@domain.com" required>        </div>        <div class="form-group">            <label for="phone">Số điện thoại</label>            <input type="tel" id="phone" name="phone" placeholder="0912345678" required>        </div>        <div class="form-group">            <label>Giới tính</label>            <div class="radio-group">                <label><input type="radio" name="gender" value="Nam" checked> Nam</label>                <label><input type="radio" name="gender" value="Nữ"> Nữ</label>            </div>        </div>        <div class="btn-container">            <input type="submit" value="Đăng ký">            <input type="reset" value="Nhập lại">        </div>    </form></div></body></html>
