<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Form Tìm kiếm</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .search-container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #1a73e8;
            font-size: 26px;
            margin-bottom: 24px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            transition: box-shadow 0.2s;
        }
        input[type="text"]:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
        }
        input[type="submit"] {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 24px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        input[type="submit"]:hover {
            background-color: #1557b0;
        }
        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="search-container">
    <h1>Tìm Kiếm Trực Tuyến</h1>
    
    <!-- Form tìm kiếm kết nối đến Google Search -->
    <form action="https://www.google.com.vn/search" method="GET"> 
        <div class="search-box">
            <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm..." required/>
            <input type="submit" value="Tìm kiếm"/>
        </div>
    </form>

    <div class="note">
        <b>💡 Mẹo sử dụng Bing Search:</b> Nếu bạn muốn chuyển sang công cụ tìm kiếm của Bing theo yêu cầu mở rộng, chỉ cần đổi thuộc tính <code>action</code> thành: <br>
        <code>action="https://www.bing.com/search"</code>
    </div>
</div>

</body>
</html>
