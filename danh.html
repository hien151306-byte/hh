<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 40px;
            color: #212529;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        h1 {
            color: #1a73e8;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 26px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 16px;
            text-align: left;
        }
        th {
            background-color: #f1f3f5;
            color: #333;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        td:nth-child(2), th:nth-child(2),
        td:nth-child(3), th:nth-child(3) {
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Danh sách sản phẩm</h1>
    <table border="1">
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Laptop Dell Inspiron 15</td>
            <td>18.500.000 đ</td>
            <td>12</td>
        </tr>
        <tr>
            <td>Chuột không dây Logitech</td>
            <td>350.000 đ</td>
            <td>45</td>
        </tr>
        <tr>
            <td>Bàn phím cơ Gaming</td>
            <td>1.200.000 đ</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Màn hình LG UltraWide 29"</td>
            <td>5.400.000 đ</td>
            <td>8</td>
        </tr>
    </table>
</div>

</body>
</html>
