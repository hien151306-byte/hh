<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên kết yêu thích của tôi</title>
</head>
<body>

    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách không có thứ tự chứa 3 liên kết đến các trang web khác nhau -->
    <h2>Trang web yêu thích</h2>
    <ul>
        <li><a href="https://www.google.com">Google Search - Tìm kiếm thông tin</a></li>
        <li><a href="https://github.com">GitHub - Nền tảng lưu trữ mã nguồn</a></li>
        <li><a href="https://vi.wikipedia.org">Wikipedia - Bách khoa toàn thư mở</a></li>
    </ul>

    <!-- Các liên kết bổ sung theo yêu cầu -->
    <h2>Khám phá thêm</h2>
    <ul>
        <!-- Liên kết mở trong tab mới (target="_blank") -->
        <li><a href="https://developer.mozilla.org" target="_blank">MDN Web Docs (Mở trong tab mới)</a></li>
        
        <!-- Liên kết đến một file HTML khác trong cùng thư mục -->
        <li><a href="about.html">Trang giới thiệu cá nhân (about.html)</a></li>
        
        <!-- Liên kết đến email (mailto:) -->
        <li><a href="mailto:hoangtranghien@example.com">Gửi email liên hệ cho tôi</a></li>
    </ul>

</body>
</html>
