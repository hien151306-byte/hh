<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập CSS Box Model 1</title>
    
    <!-- CSS được gộp trực tiếp vào trong thẻ style -->
    <style>
        /* Định dạng chung cho trang web */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            padding: 30px;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
        }

        /* Định dạng chung cho tất cả các thẻ .card */
        .card {
            width: 280px;
            height: 150px;
            padding: 20px;
            border: 5px solid #3498db;
            margin: 20px auto; /* Căn giữa các thẻ và tạo khoảng cách 20px */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Thẻ đầu tiên: sử dụng content-box (mặc định) và màu xanh lá cây */
        .card-1 {
            box-sizing: content-box;
            background-color: #2ecc71;
        }

        /* Thẻ thứ hai: sử dụng border-box và màu vàng */
        .card-2 {
            box-sizing: border-box;
            background-color: #f1c40f;
        }

        /* Thẻ thứ ba: sử dụng border-box và màu đỏ */
        .card-3 {
            box-sizing: border-box;
            background-color: #e74c3c;
            color: #ffffff; /* Đổi màu chữ trắng cho dễ đọc trên nền đỏ */
        }
    </style>
</head>
<body>

    <h1>So sánh Box-Sizing: content-box và border-box</h1>

    <!-- Thẻ thứ nhất -->
    <div class="card card-1">
        <h3>Thẻ 1</h3>
        <p>Sử dụng <code>content-box</code>. Kích thước thực tế bị cộng thêm padding và border.</p>
    </div>

    <!-- Thẻ thứ hai -->
    <div class="card card-2">
        <h3>Thẻ 2</h3>
        <p>Sử dụng <code>border-box</code>. Kích thước hiển thị đúng bằng width/height đã định nghĩa.</p>
    </div>

    <!-- Thẻ thứ ba -->
    <div class="card card-3">
        <h3>Thẻ 3</h3>
        <p>Sử dụng <code>border-box</code> với nền đỏ để phân biệt.</p>
    </div>

</body>
</html>
