<!DOCTYPE html><html lang="vi"><head>    <meta charset="utf-8">    <title>Form Đăng Ký Học Viên & Liên Hệ</title>    <style>        body {            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;            background-color: #f0f2f5;            margin: 0;            padding: 40px 20px;            color: #333;        }        .container {            max-width: 650px;            margin: 0 auto;            background: #ffffff;            padding: 40px;            border-radius: 12px;            box-shadow: 0 4px 20px rgba(0,0,0,0.08);        }        h2 {            color: #1a73e8;            margin-top: 0;            border-bottom: 2px solid #f1f3f5;            padding-bottom: 12px;            font-size: 24px;        }        .form-group {            margin-bottom: 20px;        }        label {            display: block;            font-weight: bold;            margin-bottom: 6px;            color: #444;            font-size: 14px;        }        .required {            color: red;        }        input[type="text"],        input[type="email"],        input[type="tel"],        input[type="date"],        select,        textarea {            width: 100%;            padding: 10px 14px;            font-size: 14px;            border: 1px solid #ccd0d5;            border-radius: 6px;            box-sizing: border-box;            transition: border-color 0.2s, box-shadow 0.2s;        }        input[type="text"]:focus,        input[type="email"]:focus,        input[type="tel"]:focus,        input[type="date"]:focus,        select:focus,        textarea:focus {            border-color: #1a73e8;            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);            outline: none;        }        .inline-group {            display: flex;            gap: 15px;        }        .checkbox-group, .radio-group {            display: flex;            flex-wrap: wrap;            gap: 20px;            margin-top: 6px;        }        .checkbox-group label, .radio-group label {            font-weight: normal;            display: inline-flex;            align-items: center;            gap: 6px;            cursor: pointer;        }        textarea {            resize: vertical;            height: 100px;        }        .btn-container {            margin-top: 30px;            display: flex;            gap: 12px;        }        input[type="submit"], input[type="reset"] {            padding: 12px 24px;            font-size: 15px;            font-weight: bold;            border: none;            border-radius: 6px;            cursor: pointer;            transition: background-color 0.2s;        }        input[type="submit"] {            background-color: #1a73e8;            color: white;        }        input[type="submit"]:hover {            background-color: #1557b0;        }        input[type="reset"] {            background-color: #e4e6eb;            color: #4b4f56;        }        input[type="reset"]:hover {            background-color: #d8dadf;        }        hr {            border: none;            border-top: 1px solid #eaeaea;            margin: 35px 0;        }    </style></head><body><div class="container">    <form method="post" action="">                <!-- PHẦN 1: FORM THÔNG TIN CƠ BẢN -->        <h2>Phần 1: Form Thông Tin Cơ Bản</h2>                <div class="form-group">            <label for="yourname">Họ và tên <span class="required">*</span></label>            <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>        </div>        <div class="form-group">            <label for="email">Email <span class="required">*</span></label>            <input type="email" id="email" name="email" placeholder="example@domain.com" required>        </div>        <div class="form-group">            <label>Sở thích</label>            <div class="checkbox-group">                <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>                <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>                <label><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>                <label><input type="checkbox" name="hobby" value="coding"> Lập trình</label>            </div>        </div>        <div class="btn-container">            <input type="submit" value="Gửi thông tin">            <input type="reset" value="Nhập lại">        </div>        <hr>        <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->        <h2>Phần 2: Đăng Ký Học Viên</h2>        <div class="form-group">            <label for="fullname">Họ và tên <span class="required">*</span></label>            <input type="text" id="fullname" name="fullname" placeholder="Nhập đầy đủ họ tên học viên..." required>        </div>        <div class="inline-group">            <div class="form-group" style="flex: 1;">                <label for="reg_email">Email <span class="required">*</span></label>                <input type="email" id="reg_email" name="email" placeholder="hocvien@domain.com" required>            </div>            <div class="form-group" style="flex: 1;">                <label for="phone">Số điện thoại <span class="required">*</span></label>                <input type="tel" id="phone" name="phone" placeholder="0912345678" required>            </div>        </div>        <div class="form-group">            <label for="birthday">Ngày sinh</label>            <input type="date" id="birthday" name="birthday">        </div>        <div class="form-group">            <label>Giới tính</label>            <div class="radio-group">                <label><input type="radio" name="gender" value="male" checked> Nam</label>                <label><input type="radio" name="gender" value="female"> Nữ</label>                <label><input type="radio" name="gender" value="other"> Khác</label>            </div>        </div>        <div class="form-group">            <label for="address">Địa chỉ</label>            <input type="text" id="address" name="address" placeholder="Số nhà, tên đường, quận/huyện, tỉnh/thành phố">        </div>        <div class="form-group">            <label for="course">Khóa học đăng ký</label>            <select id="course" name="course">                <option value="" disabled selected>-- Chọn khóa học phù hợp --</option>                <option value="html_css">HTML & CSS</option>                <option value="javascript">JavaScript</option>                <option value="java">Java</option>                <option value="python">Python</option>            </select>        </div>        <div class="form-group">            <label>Hình thức học</label>            <div class="radio-group">                <label><input type="radio" name="study_type" value="online" checked> Online</label>                <label><input type="radio" name="study_type" value="offline"> Offline</label>            </div>        </div>        <div class="form-group">            <label>Sở thích cá nhân</label>            <div class="checkbox-group">                <label><input type="checkbox" name="hobby" value="tech"> Công nghệ</label>                <label><input type="checkbox" name="hobby" value="design"> Thiết kế UI/UX</label>                <label><input type="checkbox" name="hobby" value="gaming"> Chơi game</label>                <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>            </div>        </div>        <div class="form-group">            <label for="note">Ghi chú thêm</label>            <textarea id="note" name="note" placeholder="Yêu cầu đặc biệt hoặc thời gian có thể học..."></textarea>        </div>        <div class="btn-container">            <input type="submit" value="Đăng ký">            <input type="reset" value="Nhập lại">        </div>    </form></div></body></html>
