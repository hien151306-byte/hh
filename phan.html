<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định dạng văn bản với HTML Styles</title>
</head>
<body>

    <!-- Một tiêu đề <h1> có màu xanh dương, nội dung: "Bài viết của tôi" -->
    <h1 style="color: blue;">Bài viết của tôi</h1>

    <!-- Một đoạn văn <p> có màu đỏ và chữ in đậm -->
    <p style="color: red;"><b>Đây là đoạn văn được định dạng màu sắc</b></p>

    <!-- Một đoạn văn khác <p> có chữ in nghiêng và căn giữa -->
    <p style="text-align: center;"><i>Tôi đang học HTML Styles</i></p>

    <!-- Một đoạn văn cuối cùng <p> có kích thước chữ 20px và gạch chân -->
    <p style="font-size: 20px; text-decoration: underline;">Định dạng văn bản giúp trang web đẹp hơn</p>

</body>
</html>
